name: docker

# Merge = release: on every push to main the pipeline bumps the version
# (scripts/next-version.mjs — commit-scan SemVer), commits + tags it, and
# publishes the image under the bumped version after the smoke is green.
# Hand-pushing a v* tag (owner PAT) stays the override lever and skips the
# bump. Pushes made with GITHUB_TOKEN never trigger workflows, so the bump
# commit cannot recurse, and the release must live in this same run.

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  # One lane for BOTH triggers — two runs can never race the version/tags.
  # Not cancellable: a queued run waits, it never kills a publishing run.
  group: docker-release
  cancel-in-progress: false

env:
  IMAGE: evanrh/bum

jobs:
  bump:
    # Main pushes only; manual tag-push runs skip straight to build.
    if: github.ref == 'refs/heads/main'
    name: bump version + tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      # "1.3.0" and the tag ref "v1.3.0" the build must check out.
      version: ${{ steps.bump.outputs.version }}
      ref: ${{ steps.bump.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags + full history feed the commit scan
      - name: install dev dependencies (semver powers scripts/next-version.mjs)
        run: npm ci
      - id: bump
        name: next version → bump commit → annotated tag → push
        run: |
          set -euo pipefail
          # The runner has no git identity — the bump commit AND the annotated
          # tag both need one (the v1.3.0 first run died at `git tag -a`).
          git config user.name 'bum-release'
          git config user.email 'bum-release@users.noreply.github.com'
          VERSION="$(node scripts/next-version.mjs)"
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            # Already-released version (full rerun after smoke): reuse the
            # existing tag — the rerun must not produce a second bump.
            echo "tag v${VERSION} already exists — reusing it"
          else
            npm pkg set version="${VERSION}"
            npm install --package-lock-only
            git add package.json package-lock.json
            # The tree may already be at VERSION (a hand-bump, like #58's);
            # a no-op must still produce the tag, not die on an empty commit.
            if git diff --staged --quiet; then
              echo "version already at ${VERSION} — syncing the tag only"
            else
              git -c user.name='bum-release' -c user.email='bum-release@users.noreply.github.com' \
                commit -m "chore: bump version to ${VERSION}"
            fi
            git tag -a "v${VERSION}" -m "bum ${VERSION} — automated release bump"
            # GITHUB_TOKEN push: no workflow recursion is possible.
            git push origin "v${VERSION}" HEAD:"$GITHUB_REF_NAME"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "ref=v${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    # One native runner per architecture (no QEMU — issue #46). Each job
    # pushes its image BY DIGEST to Docker Hub; the release job merges both
    # digests into one multi-arch manifest once the smoke is green. On main
    # pushes the checkout is the bump commit, so the image carries its own
    # version; manual tag runs build from the tag itself.
    name: build (${{ matrix.platform }})
    needs: [bump]
    if: always() && (needs.bump.result == 'success' || needs.bump.result == 'skipped')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            artifact: digests-linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            artifact: digests-linux-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.ref || github.ref }}
      - uses: docker/setup-buildx-action@v3
      - name: login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: build
        name: build + push by digest
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  smoke:
    # Boot the amd64 image that was just pushed (by digest) and check the
    # container guarantees — via `docker exec` against the RUNNING
    # container (exec has no entrypoint interposition, so a "run this
    # binary" check can never be swallowed by the boot entrypoint, which is
    # what hung run 45304631203). Every command is timeboxed and the job is
    # capped: no smoke mistake can hang a release again. Manifest merge is
    # gated on this: a failed smoke means nothing gets tagged.
    name: live smoke (amd64)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: digests-linux-amd64
          path: /tmp/digests
      - name: boot (entrypoint only — no command args)
        run: |
          set -euo pipefail
          AMD_HEX="$(find /tmp/digests -type f -printf '%f\n' | head -1)"
          echo "$AMD_HEX" | grep -qE '^[0-9a-f]{64}$'
          # A fresh install's bind source is root-owned by default — keep it
          # that way so the container's root preflight + chown is exercised.
          sudo rm -rf /tmp/bum-data && sudo mkdir -p /tmp/bum-data
          docker run -d --name bum-ci \
            -e SITE_URL=http://127.0.0.1:4321 -e BOOTSTRAP_JOIN_CODE=cismokecode \
            -v /tmp/bum-data:/data -p 127.0.0.1:4321:4321 \
            ${{ env.IMAGE }}@sha256:"$AMD_HEX"

      - name: checks (exec inside the running container)
        run: |
          set -euo pipefail
          for _ in $(seq 1 45); do
            curl -sf http://127.0.0.1:4321/api/health >/dev/null 2>&1 && break
            sleep 2
          done
          timeout 30 curl -sf http://127.0.0.1:4321/api/health | grep -q '"ok":true'
          timeout 30 curl -sf http://127.0.0.1:4321/ | grep -q 'og:url" content="http://127.0.0.1:4321/"'
          timeout 30 docker logs bum-ci 2>&1 | grep -q 'migrations applied'
          timeout 30 docker logs bum-ci 2>&1 | grep -q 'jobs runner ready'
          # A pinned BOOTSTRAP_JOIN_CODE is honored silently — the code must
          # never appear in the logs (only a generated one is shown once).
          if timeout 30 docker logs bum-ci 2>&1 | grep -q 'bootstrap join code:'; then
            echo 'pinned join code leaked into the container log'
            docker logs bum-ci | tail -20
            exit 1
          fi
          # The covers lever — via exec, on the same data. Root-owned WAL
          # files would break it, so this also asserts the drop-to-node.
          timeout 60 docker exec -u node bum-ci \
            node dist/jobs/backfill-covers.mjs

      - name: checks — preflight refuses a missing SITE_URL
        run: |
          set -euo pipefail
          # SITE_URL is scrubbed via exec's env override; the boot entrypoint
          # must exit 1 immediately — before any fs/db work — with the
          # actionable message. Exec cannot be swallowed by entrypoint
          # interposition, and timeout bounds it regardless.
          if timeout 60 docker exec -e SITE_URL= bum-ci node dist/jobs/boot.mjs >/tmp/pf.log 2>&1; then
            echo 'preflight must refuse a blank SITE_URL'
            cat /tmp/pf.log
            exit 1
          fi
          grep -q 'SITE_URL is required at runtime' /tmp/pf.log

      - name: teardown
        if: always()
        run: docker rm -f bum-ci

  release:
    needs: [smoke, bump]
    if: always() && needs.smoke.result == 'success' && (needs.bump.result == 'success' || needs.bump.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - name: login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: resolve release tags
        # Main pushes release the computed bump; manual tag runs release the
        # pushed tag itself. House tags: X.Y.Z, X.Y, latest.
        run: |
          set -euo pipefail
          SOURCE="${{ needs.bump.outputs.version || github.ref_name }}"
          VERSION="${SOURCE#v}"
          MINOR="${VERSION%.*}"
          echo "TAGS=-t ${IMAGE}:${VERSION} -t ${IMAGE}:${MINOR} -t ${IMAGE}:latest" >> "$GITHUB_ENV"
      # The single multi-arch manifest: both already-pushed per-arch images
      # joined under the release tags. Atomic from the user's point of view.
      - name: merge digests into the release manifest
        working-directory: ${{ runner.temp }}/digests
        run: >
          docker buildx imagetools create
          ${{ env.TAGS }}
          $(printf '${{ env.IMAGE }}@sha256:%s ' *)
