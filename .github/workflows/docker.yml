name: docker

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: evanrh/bum

jobs:
  release:
    # Runs ONCE per release — no PR/main docker builds (owner call, #40).
    # Sequence: build amd64 → live-smoke the actual container → only then
    # the multi-arch push (arm64 under QEMU). The buildx push is atomic, so
    # a failed smoke or arm leg blocks the release rather than shipping a
    # broken image.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: build amd64 (local, for the smoke)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: live smoke — first boot (preflight → migrations → health → og:url)
        run: |
          set -euo pipefail
          # A fresh install's bind source is root-owned by default — keep it
          # that way so the container's root preflight + chown is exercised.
          sudo rm -rf /tmp/bum-data && sudo mkdir -p /tmp/bum-data
          docker run -d --name bum-ci \
            -e SITE_URL=http://127.0.0.1:4321 -e BOOTSTRAP_JOIN_CODE=cismokecode \
            -v /tmp/bum-data:/data -p 127.0.0.1:4321:4321 ${{ env.IMAGE }}:ci
          for _ in $(seq 1 45); do
            curl -sf http://127.0.0.1:4321/api/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -sf http://127.0.0.1:4321/api/health | grep -q '"ok":true'
          curl -sf http://127.0.0.1:4321/ | grep -q 'og:url" content="http://127.0.0.1:4321/"'
          docker logs bum-ci 2>&1 | grep -q 'migrations applied'
          docker logs bum-ci 2>&1 | grep -q 'jobs runner ready'
          # A pinned BOOTSTRAP_JOIN_CODE is honored silently — the code must
          # never appear in the logs (only a generated one gets printed once).
          if docker logs bum-ci 2>&1 | grep -q 'bootstrap join code:'; then
            echo 'pinned join code leaked to the container log'
            docker logs bum-ci 2>&1 | tail -20
            exit 1
          fi
          docker rm -f bum-ci

      - name: live smoke — missing SITE_URL exits before touching the data dir
        run: |
          set -euo pipefail
          sudo mkdir -p /tmp/bum-pf
          if docker run --rm \
            -e DATABASE_URL=/data/never-created.db \
            -v /tmp/bum-pf:/data ${{ env.IMAGE }}:ci >/tmp/pf.log 2>&1; then
            echo "boot without SITE_URL must fail the preflight"
            cat /tmp/pf.log
            exit 1
          fi
          grep -q 'SITE_URL is required at runtime' /tmp/pf.log
          test ! -e /tmp/bum-pf/never-created.db

      - name: live smoke — covers lever runs standalone (as node)
        run: |
          docker run --rm -u node \
            -e SITE_URL=http://127.0.0.1:4321 -e DATABASE_URL=/data/bum.db \
            -v /tmp/bum-data:/data ${{ env.IMAGE }}:ci \
            node dist/jobs/backfill-covers.mjs

      # Smoke green before anything reaches Docker Hub. Requires
      # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN repo secrets (owner-side,
      # issue #40).
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
