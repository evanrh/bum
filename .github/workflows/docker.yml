name: docker

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: evanrh/bum

jobs:
  validate:
    # Build the image (amd64) exactly as shipped and boot the real
    # ENTRYPOINT: env preflight, root prep → privilege drop, startup
    # migrations, supervised web + cron, runtime OG origin — the live
    # guarantees of the single-container design (issues #39/#40).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: live smoke — first boot (preflight → migrations → health → og:url)
        run: |
          set -euo pipefail
          # A fresh install's bind source is root-owned by default — keep it
          # that way so the container's root preflight + chown is exercised.
          sudo rm -rf /tmp/bum-data && sudo mkdir -p /tmp/bum-data
          docker run -d --name bum-ci \
            -e SITE_URL=http://127.0.0.1:4321 -e BOOTSTRAP_JOIN_CODE=cismokecode \
            -v /tmp/bum-data:/data -p 127.0.0.1:4321:4321 ${{ env.IMAGE }}:ci
          for _ in $(seq 1 45); do
            curl -sf http://127.0.0.1:4321/api/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -sf http://127.0.0.1:4321/api/health | grep -q '"ok":true'
          curl -sf http://127.0.0.1:4321/ | grep -q 'og:url" content="http://127.0.0.1:4321/"'
          docker logs bum-ci 2>&1 | grep -q 'migrations applied'
          docker logs bum-ci 2>&1 | grep -q 'bootstrap join code: cismokecode'
          docker logs bum-ci 2>&1 | grep -q 'jobs runner ready'
          docker rm -f bum-ci

      - name: live smoke — missing SITE_URL exits before touching the data dir
        run: |
          set -euo pipefail
          sudo mkdir -p /tmp/bum-pf
          if docker run --rm \
            -e DATABASE_URL=/data/never-created.db \
            -v /tmp/bum-pf:/data ${{ env.IMAGE }}:ci >/tmp/pf.log 2>&1; then
            echo "boot without SITE_URL must fail the preflight"
            cat /tmp/pf.log
            exit 1
          fi
          grep -q 'SITE_URL is required at runtime' /tmp/pf.log
          test ! -e /tmp/bum-pf/never-created.db

      - name: live smoke — covers lever runs standalone (as node)
        run: |
          docker run --rm -u node \
            -e SITE_URL=http://127.0.0.1:4321 -e DATABASE_URL=/data/bum.db \
            -v /tmp/bum-data:/data ${{ env.IMAGE }}:ci \
            node dist/jobs/backfill-covers.mjs

  publish:
    # Tags only; requires DOCKERHUB_USERNAME / DOCKERHUB_TOKEN repo secrets
    # (owner-side). amd64 + arm64 via QEMU — arm64 is emulated and slow.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
