# One container (issue #39): `boot` validates env, applies migrations, then
# supervises the web server and the nightly cron as two processes of this
# service. The container starts as root on purpose: boot chowns ./data and
# drops to the image's `node` user before spawning anything. No init/tini
# is needed — boot reaps its two children itself.
services:
  bum:
    build: .
    environment:
      SITE_URL: "${SITE_URL:?SITE_URL is required at runtime — copy .env.example to .env or export it}"
      BOOTSTRAP_JOIN_CODE: ${BOOTSTRAP_JOIN_CODE:-}
    ports:
      - "4321:4321"
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - "-"
        - http://127.0.0.1:4321/api/health
      interval: 10s
      timeout: 3s
      retries: 5
